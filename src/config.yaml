# Power Rankings settings. Edit numbers here, commit, and the next run uses them.
# (The sliders on the website override the weights in your browser without changing this file.)

cfb:
  # Default slider positions (0-100). The website starts with these.
  # Oct 27 2026 ("D Balanced", CFB Model Review.pdf): résumé-first, with the betting markets' view baked in. Was power 30,
  # résumé 20, efficiency 20, sos 10, recent 10, cupcake 5, luck 5: about 60% of that measured how dominant a team
  # looks (power, efficiency, recent), so 6-2 LSU with no top-25 wins was #1. Backtest on 794 games: 70.5% vs 68.9%.
  default_weights:
    resume: 30       # Strength of record: wins that a top-12 team would NOT be guaranteed; every loss costs
    market: 25       # Hidden (model.HIDDEN): strength implied by the books' lines on games already played
    power: 15        # Opponent-adjusted scoring margin (who you beat, by how much, capped)
    efficiency: 15   # Opponent-adjusted EPA/play + success rate, garbage time removed
    cupcake: 10      # Cupcake score (higher = softer schedule) counts AGAINST a team
    recent: 5        # How the team has played in its last few games
    sos: 0           # Off: Power and Résumé already account for who you played (it was lifting 4-3 SEC teams)
    luck: 0          # Off: no help predicting, and Résumé already counts close losses
  model:
    margin_cap: 24          # Points. A 63-0 win counts the same as a 24-0 win.
    home_field: 2.5         # Points of home-field advantage
    fcs_rating: -25         # Starting point for an FCS team with no track record (average FBS team = 0)
    lower_div_rating: -40   # Starting point for Division II/III opponents
    fcs_prior_games: 8      # FCS teams are pulled toward last year's rating / the FCS average like this many games (tested: 8 beat 1, 2, 4 and 16 on 2025-26 results)
    fcs_game_weight: 0.25   # FCS games count 25% as much as FBS games in the power rating
    game_sigma: 15          # Std. dev. of a game result in points (used for win probabilities)
    recent_games: 3         # Games used for "recent form"
    cupcake_gap: 14         # An opponent is a cupcake once they're this many points worse than you...
    cupcake_span: 21        # ...counting fully at gap + span (35+ points worse)
    cupcake_max_opp: 0      # ...and only if they're below an average FBS team (rating < 0). FCS always counts.
    cotw_min_margin: 21     # Cupcake of the Week needs a win by at least this much
    benchmark_rank: 12      # Résumé = wins compared with what the #12 team (a playoff team) would get (was 25)
    loss_floor: 0.5         # ...and every loss costs at least half a win, even to a great team
    market_prior_games: 2   # Market factor: the preseason guess counts like this many games of lines
    prior_games: 5          # Preseason expectation counts like this many games in week 1...
    prior_fade_week: 9      # ...and fades to zero by this week (backtested on 2025-26: best of 8 settings, though all were close)
    one_score: 8            # Margin that counts as a "one-score game"
    spread_scale: 1.2       # (only used if the predict_ settings below are removed)
    # Win chances blend power with efficiency. Fit on 2025-26 games (predicting each week from the week before):
    # picked 73.2% of 2025 winners vs 71.7% with power alone. Résumé was tested too and made predictions worse.
    predict_power: 0.73       # points per point of power rating difference
    predict_efficiency: 4.6   # points per unit of efficiency difference (opponent-adjusted EPA/play + success rate)
    predict_home: 3.5         # home field in a prediction (the power rating itself uses home_field above)
    predict_sigma: 15.4       # spread of results around the prediction
    done_share: 0.9         # Share of a week's games that must be final before it's published

nfl:
  default_weights:
    power: 40        # (was 30; +10 from SOS, Oct 12 2026: Power already adjusts for opponents, so a big SOS weight
                     # counted a hard schedule twice and lifted 0-5 Miami over 1-3-1 Washington)
    resume: 15       # Wins compared with what the #8 team would get against the same schedule
    efficiency: 25   # Opponent-adjusted EPA/play (offense minus defense)
    sos: 5           # (was 15, Oct 12 2026; see power)
    recent: 10
    luck: 5          # "Bad luck": one-score results count as coin flips
  model:
    # NFL ratings come from src/nfl_model.py (its own model: last season carries over all year, scoring margin
    # blended with EPA/play, recent weeks count more, backup QBs marked down). Tuned on 2020-2025; see that file.
    margin_cap: 17          # Matches nfl_model.py: results past ~2.5 scores are mostly garbage time
    home_field: 1.0         # Modern NFL home-field edge is small (backtest picked 1.0)
    fcs_rating: 0           # (not used in the NFL)
    fcs_game_weight: 1
    game_sigma: 13.0
    recent_games: 3
    benchmark_rank: 8
    # Cupcake: only a real mismatch counts. The opponent has to be clearly bad (rating -2.5 or worse, about the
    # bottom quarter of the league) AND you have to be 5+ points better, with full credit at 10+ points better.
    # (The old rule counted any below-average team that was worse than you, which flagged teams like the Lions.)
    cupcake_gap: 5
    cupcake_span: 5
    cupcake_max_opp: -2.5
    # Bully of the Week: simply the week's biggest blowout (largest winning margin). No cupcakes in the NFL.
    cotw_min_margin: 1
    cotw_any_weaker: true
    cotw_margin_only: true
    prior_games: 3
    prior_fade_week: 6
    one_score: 8
    spread_scale: 1.0       # Calibrated on past seasons (see README)
    done_share: 0.8         # Publish Monday morning even with Monday Night Football still to play
