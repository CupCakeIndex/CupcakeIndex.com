<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>The Vault · Football Card PC</title>
<meta name="description" content="A personal collection of football cards, from the Cupcake Index.">
<meta name="theme-color" content="#08080a">
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* The Vault: black velvet case, gold foil type, cards that shine like holo when you tilt them */
:root { --bg: #08080a; --panel: #121216; --line: #24242b; --ink: #f2f0ea; --muted: #8e8b84; --gold: #d8b45a; --gold2: #f3dc8f; --red: #ff6b5b;
  --display: Anton, "Arial Narrow", sans-serif; --body: Inter, system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
body { background: radial-gradient(1200px 600px at 50% -200px, #1c1a14 0%, transparent 70%), var(--bg); min-height: 100vh; }
a { color: var(--gold); }
.wrap { max-width: 1180px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px 60px; }
header.top { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; padding: 8px 0 18px; border-bottom: 1px solid var(--line); }
.brand small { display: block; font: 700 11px var(--mono); letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
.brand small a { color: var(--muted); text-decoration: none; } .brand small a:hover { color: var(--gold); }
h1 { margin: 2px 0 0; font: 400 clamp(44px, 9vw, 84px)/.9 var(--display); letter-spacing: .02em; text-transform: uppercase;
  background: linear-gradient(100deg, #b98d34 0%, var(--gold2) 30%, #a87b28 55%, var(--gold2) 80%, #b98d34 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.who { color: var(--muted); font-size: 14px; margin-top: 6px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
button, .btn { font: 700 13px var(--body); padding: 10px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; cursor: pointer; text-decoration: none; }
button:hover, .btn:hover { border-color: var(--gold); }
.primary { background: linear-gradient(180deg, var(--gold2), var(--gold)); color: #1a1408; border-color: transparent; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat b { display: block; font: 400 34px/1 var(--display); color: var(--gold2); }
.stat span { font: 700 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
.tools input[type=search], .tools select { font: 16px var(--body); padding: 9px 12px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; }
.tools input[type=search] { flex: 1 1 220px; min-width: 0; }
.chip { font: 700 12px var(--mono); padding: 8px 11px; border-radius: 99px; letter-spacing: .06em; }
.chip.on { border-color: var(--gold); color: var(--gold2); background: #1f1b10; }
.grail { display: grid; grid-template-columns: minmax(180px, 280px) 1fr; gap: 26px; align-items: center; background: linear-gradient(135deg, #17150f, #0d0d10); border: 1px solid #3a3020; border-radius: 16px; padding: 22px; margin-bottom: 26px; }
.grail .card .meta { display: none; }   /* the details sit beside the grail instead */
.grail > *, .stats > *, .grid > * { min-width: 0; }
html, body { overflow-x: hidden; }
.grail h2 { margin: 0 0 4px; font: 400 14px var(--mono); letter-spacing: .25em; color: var(--gold); text-transform: uppercase; }
.grail h3 { margin: 0; font: 400 clamp(30px, 5vw, 48px)/1 var(--display); text-transform: uppercase; }
.grail p { color: var(--muted); margin: 8px 0 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 22px 18px; }
/* a card: 2.5 x 3.5, flips on tap, holo shine follows the pointer */
.card { perspective: 900px; cursor: pointer; }
.card .inner { position: relative; aspect-ratio: 5 / 7; transition: transform .75s cubic-bezier(.3, 1.4, .5, 1); transform-style: preserve-3d;
  transform: translateZ(var(--lift, 0px)) rotateY(var(--flip, 0deg)) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); }
.card.flipped .inner { --flip: 180deg; }
.card.spinning .inner { --lift: 60px; }   /* lifts toward you mid-spin, then settles */
.face { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; backface-visibility: hidden; background: #1a1a20 center / cover no-repeat;
  box-shadow: 0 10px 28px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06); }
.face.back { transform: rotateY(180deg); }
.face.empty { display: grid; place-items: center; color: var(--muted); font: 12px var(--mono); text-align: center; padding: 10px; }
.face::after { content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge; opacity: 0; transition: opacity .3s;
  background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.55), transparent 40%),
    linear-gradient(115deg, transparent 20%, rgba(255,80,180,.25) 35%, rgba(80,220,255,.25) 50%, rgba(255,230,90,.25) 65%, transparent 80%); }
.card:hover .face::after, .card.tilt .face::after { opacity: .7; }
.meta { margin-top: 10px; display: grid; gap: 2px; }
.meta b { font: 400 19px/1.1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.meta span { color: var(--muted); font-size: 12.5px; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.tag { font: 700 10px var(--mono); letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.tag.rc { color: #7ee0a0; border-color: #2c5a3c; } .tag.auto { color: #ffb4d6; border-color: #5a2c44; } .tag.num { color: var(--gold2); border-color: #5a4a20; } .tag.grade { color: #9ec6ff; border-color: #2c3f5a; }
.own { display: flex; gap: 6px; margin-top: 6px; } .own button { padding: 5px 9px; font-size: 11px; }
.team-h { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; margin: 14px 0 -4px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  font: 400 26px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.team-h:first-child { margin-top: 0; }
.team-h img { width: 34px; height: 34px; object-fit: contain; }
.team-h small { margin-left: auto; font: 700 11px var(--mono); letter-spacing: .1em; color: var(--muted); }
.empty-state { text-align: center; padding: 60px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: 16px; }
.empty-state h3 { font: 400 30px var(--display); color: var(--ink); margin: 0 0 6px; text-transform: uppercase; }
footer { margin-top: 40px; color: var(--muted); font-size: 12px; text-align: center; }
/* add / edit card */
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.72); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.sheet form { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
.sheet h2 { margin: 0; font: 400 30px var(--display); text-transform: uppercase; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label.f { display: grid; gap: 4px; font: 700 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
label.f input, label.f select, label.f textarea { font: 16px var(--body); padding: 9px 10px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; text-transform: none; letter-spacing: 0; }
.checks { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo { position: relative; aspect-ratio: 5 / 7; border: 1px dashed #3a3a44; border-radius: 10px; display: grid; place-items: center; text-align: center; color: var(--muted);
  font: 12px var(--mono); background: var(--bg) center / cover no-repeat; cursor: pointer; overflow: hidden; }
.photo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.status { font: 12px var(--mono); color: var(--gold2); min-height: 1em; }
.hint { margin: 0; color: var(--muted); font-size: 12.5px; }
.photos > div, .photos { align-items: start; }
.pcell { display: grid; gap: 6px; }
.adj { justify-self: center; margin-top: -4px; padding: 5px 10px; font-size: 11px; }
/* card search */
.srch { display: grid; gap: 8px; }
.srch-bar { display: flex; gap: 8px; } .srch-bar input { flex: 1; min-width: 0; font: 16px var(--body); padding: 9px 10px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; }
.srch-res { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-height: 340px; overflow-y: auto; }
.srch-hit { display: grid; gap: 4px; padding: 6px; text-align: left; font: 11px/1.3 var(--body); color: var(--muted); }
.srch-hit img { width: 100%; aspect-ratio: 5 / 7; object-fit: cover; border-radius: 6px; background: #1a1a20; }
.srch-hit span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* card cropper */
.crop-sheet { z-index: 60; }
.crop { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 10px; justify-items: center; max-width: 100%; }
.crop h2 { margin: 0; font: 400 26px var(--display); text-transform: uppercase; }
.crop-stage { position: relative; touch-action: none; }
.crop-stage canvas { display: block; border-radius: 6px; }
.crop-box { position: absolute; border: 2px solid var(--gold2); border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0,0,0,.6); cursor: move; touch-action: none; }
.crop-h { position: absolute; right: -9px; bottom: -9px; width: 20px; height: 20px; border-radius: 50%; background: var(--gold2); border: 2px solid #1a1408; cursor: nwse-resize; }
.hidden { display: none !important; }
@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grail { grid-template-columns: 1fr; text-align: center; } .grail .card { width: min(230px, 64vw); margin: 0 auto; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
  .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .card .inner { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <small><a href="../">← Cupcake Index</a> · Football card PC</small>
      <h1>The Vault</h1>
      <div class="who" id="who">Loading the collection…</div>
    </div>
    <div class="acts">
      <button class="primary hidden" id="add">+ Add card</button>
      <button id="auth">Sign in</button>
    </div>
  </header>

  <section class="stats" id="stats"></section>
  <section id="grail"></section>
  <div class="tools" id="tools">
    <input type="search" id="q" placeholder="Search player, team, set…" aria-label="Search cards">
    <button class="chip" data-f="rc">RC</button><button class="chip" data-f="auto">AUTO</button><button class="chip" data-f="num">NUMBERED</button><button class="chip" data-f="graded">GRADED</button>
    <select id="sort" aria-label="Sort"><option value="team">By team</option><option value="new">Newest added</option><option value="year">Year (newest)</option><option value="player">Player A-Z</option></select>
  </div>
  <section class="grid" id="grid"></section>
  <footer>Tap a card to flip it. Part of <a href="../">the Cupcake Index</a>.</footer>
</div>

<script src="../firebase-config.js"></script>
<script>window.VAULT_SEARCH_URL = ""; // the Cloudflare Worker's address (workers/vault-search.js) once it's set up</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// The Vault: everyone can look; only the owner (the first account to claim it, stored at pcmeta/owner) can add,
// edit or delete. Photos are shrunk on the phone and stored in the card's Firestore document (free plan, no storage bucket).
(function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const app = firebase.initializeApp(window.FIREBASE_CONFIG), db = app.firestore(), auth = app.auth();
  let cards = [], owner = null, user = null, filters = new Set();

  // ---------- data
  async function load() {
    try {
      const [snap, o] = await Promise.all([db.collection("pc").get(), db.collection("pcmeta").doc("owner").get()]);
      owner = o.exists ? o.data() : null;
      cards = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      draw();
    } catch (e) {
      $("#who").textContent = "The collection couldn't load (" + (e.code || e.message) + ").";
    }
  }
  const isOwner = () => user && owner && owner.uid === user.uid;
  let TEAMS = [];
  fetch("../data/teams.json").then((r) => r.json()).then((d) => { TEAMS = [...(d.nfl || []), ...(d.cfb || [])]; draw(); }).catch(() => {});
  const teamInfo = (name) => {
    const n = (name || "").toLowerCase().trim();
    return n ? TEAMS.find((t) => t.name.toLowerCase() === n) || TEAMS.find((t) => (t.mascot || "").toLowerCase() === n || n.endsWith(" " + (t.mascot || "").toLowerCase())) : null;
  };

  // ---------- drawing
  const tagsOf = (c) => [c.rookie && '<span class="tag rc">RC</span>', c.auto && '<span class="tag auto">AUTO</span>',
    c.serial && `<span class="tag num">${esc(c.serial)}</span>`, c.grade && `<span class="tag grade">${esc(c.grade)}</span>`].filter(Boolean).join("");
  const face = (img, cls, label) => img ? `<div class="face ${cls}" style="background-image:url('${img}')"></div>` : `<div class="face ${cls} empty">${label}</div>`;
  const cardHtml = (c) => `<article class="card" data-id="${esc(c.id)}" tabindex="0" aria-label="${esc([c.year, c.set, c.player].filter(Boolean).join(" "))}">
      <div class="inner">${face(c.front, "front", "No photo")}${face(c.back, "back", "No back photo")}</div>
      <div class="meta"><b>${esc(c.player || "Unknown player")}</b><span>${esc([c.year, c.set, c.parallel].filter(Boolean).join(" · "))}${c.team && $("#sort").value !== "team" ? " · " + esc(c.team) : ""}</span>
        <div class="tags">${tagsOf(c)}</div>
        ${isOwner() ? `<div class="own"><button data-edit="${esc(c.id)}">Edit</button><button data-del="${esc(c.id)}">Delete</button></div>` : ""}</div></article>`;

  function draw() {
    const name = owner?.name || "My";
    document.title = `${name === "My" ? "The Vault" : name + "'s Vault"} · Football Card PC`;
    $("#who").textContent = cards.length ? `${name === "My" ? "A" : name + "'s"} football card collection · ${cards.length} card${cards.length === 1 ? "" : "s"}` : `${name === "My" ? "A" : name + "'s"} football card collection`;
    $("#add").classList.toggle("hidden", !isOwner());
    $("#auth").textContent = user ? "Sign out" : "Sign in";
    const n = (f) => cards.filter(f).length;
    $("#stats").innerHTML = [["Cards", cards.length], ["Rookies", n((c) => c.rookie)], ["Autos", n((c) => c.auto)], ["Numbered", n((c) => c.serial)]]
      .map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
    const grail = cards.find((c) => c.grail);
    $("#grail").innerHTML = grail ? `<div class="grail">${cardHtml(grail)}<div><h2>The grail</h2><h3>${esc(grail.player)}</h3>
      <p>${esc([grail.year, grail.set, grail.parallel, grail.serial, grail.grade].filter(Boolean).join(" · "))}</p>${grail.notes ? `<p>${esc(grail.notes)}</p>` : ""}</div></div>` : "";
    const q = $("#q").value.trim().toLowerCase();
    let list = cards.filter((c) => (!q || [c.player, c.team, c.set, c.parallel, c.year].join(" ").toLowerCase().includes(q))
      && (!filters.has("rc") || c.rookie) && (!filters.has("auto") || c.auto) && (!filters.has("num") || c.serial) && (!filters.has("graded") || c.grade));
    const s = $("#sort").value;
    list.sort(s === "year" ? (a, b) => (b.year || 0) - (a.year || 0) : s === "player" ? (a, b) => (a.player || "").localeCompare(b.player || "")
      : s === "team" ? (a, b) => (a.team || "~").localeCompare(b.team || "~") || (b.added || 0) - (a.added || 0) : (a, b) => (b.added || 0) - (a.added || 0));
    // By team: a header (logo, name, count) before each team's cards
    let html = "", last = null;
    for (const c of list) {
      const team = c.team || "No team";
      if (s === "team" && team !== last) {
        const t = teamInfo(team), n = list.filter((x) => (x.team || "No team") === team).length;
        html += `<h2 class="team-h">${t?.logo ? `<img src="${esc(t.logo)}" alt="" width="34" height="34">` : ""}<span>${esc(team)}</span><small>${n} card${n === 1 ? "" : "s"}</small></h2>`;
        last = team;
      }
      html += cardHtml(c);
    }
    $("#grid").innerHTML = html || `<div class="empty-state" style="grid-column:1/-1"><h3>${cards.length ? "No matches" : "The vault is empty"}</h3>
      ${cards.length ? "Try a different search or filter." : isOwner() ? "Tap <b>+ Add card</b> to put your first card in." : "Cards are on the way."}</div>`;
  }

  // ---------- flip + holo tilt
  document.addEventListener("click", (e) => {
    if (e.target.closest("button")) return;
    const c = e.target.closest(".card");
    if (c) spin(c);
  });
  function spin(c) { c.classList.add("spinning"); c.classList.toggle("flipped"); clearTimeout(c._s); c._s = setTimeout(() => c.classList.remove("spinning"), 380); }
  document.addEventListener("keydown", (e) => { const c = e.target.closest?.(".card"); if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); spin(c); } });
  document.addEventListener("pointermove", (e) => {
    const c = e.target.closest?.(".card");
    document.querySelectorAll(".card.tilt").forEach((x) => { if (x !== c) { x.classList.remove("tilt"); x.querySelector(".inner").style.removeProperty("--rx"); x.querySelector(".inner").style.removeProperty("--ry"); } });
    if (!c || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const r = c.querySelector(".inner").getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (x < 0 || x > 1 || y < 0 || y > 1) return;
    const inner = c.querySelector(".inner");
    c.classList.add("tilt");
    inner.style.setProperty("--rx", ((0.5 - y) * 14).toFixed(1) + "deg");
    inner.style.setProperty("--ry", ((x - 0.5) * 16).toFixed(1) + "deg");
    c.querySelectorAll(".face").forEach((f) => { f.style.setProperty("--mx", x * 100 + "%"); f.style.setProperty("--my", y * 100 + "%"); });
  });
  $("#q").oninput = draw;
  $("#sort").onchange = draw;
  document.querySelectorAll(".chip").forEach((b) => b.onclick = () => { filters.has(b.dataset.f) ? filters.delete(b.dataset.f) : filters.add(b.dataset.f); b.classList.toggle("on"); draw(); });

  // ---------- sign in / claim the vault
  $("#auth").onclick = async () => {
    if (user) return auth.signOut();
    const p = new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({ prompt: "select_account" });
    const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
    try { await (standalone ? auth.signInWithRedirect(p) : auth.signInWithPopup(p)); }
    catch (e) { if (/popup-blocked|operation-not-supported/.test(e.code || "")) auth.signInWithRedirect(p); else alertish("Sign-in didn't finish (" + (e.code || e.message) + ")."); }
  };
  auth.getRedirectResult().catch(() => {});
  auth.onAuthStateChanged(async (u) => {
    user = u;
    if (u && !owner) {
      // nobody owns the vault yet: the first account to sign in here claims it (the rules make this one-time)
      try {
        await db.collection("pcmeta").doc("owner").set({ uid: u.uid, name: (u.displayName || "").split(" ")[0], claimed: Date.now() });
        owner = { uid: u.uid, name: (u.displayName || "").split(" ")[0] };
      } catch (e) { /* already claimed by someone else, or rules not published yet */ }
    }
    draw();
  });
  function alertish(msg) { $("#who").textContent = msg; }

  // ---------- add / edit (owner only)
  // Card search (eBay listing photos) goes through a small Cloudflare Worker that holds the eBay key.
  // Empty until it's set up; then search shows up in "Add a card".
  const SEARCH = window.VAULT_SEARCH_URL || "";
  const CARD_W = 700, CARD_H = 980; // saved size: a 2.5 x 3.5 card

  async function bitmapOf(src) {
    if (src instanceof Blob) return createImageBitmap(src);
    const r = await fetch(src);
    if (!r.ok) throw new Error("image " + r.status);
    return createImageBitmap(await r.blob());
  }
  // Find the card in a photo: the background is whatever color fills the photo's edges; the card is the big block
  // of rows and columns that differ from it. Returns a 5:7 box around it (in image pixels).
  function autoRect(bmp) {
    const W = 200, s = W / bmp.width, H = Math.max(1, Math.round(bmp.height * s));
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const g = cv.getContext("2d", { willReadFrequently: true }); g.drawImage(bmp, 0, 0, W, H);
    const px = g.getImageData(0, 0, W, H).data, at = (x, y) => { const i = (y * W + x) * 4; return [px[i], px[i + 1], px[i + 2]]; };
    const ring = [];
    for (let x = 0; x < W; x += 2) ring.push(at(x, 1), at(x, H - 2));
    for (let y = 0; y < H; y += 2) ring.push(at(1, y), at(W - 2, y));
    const med = [0, 1, 2].map((k) => ring.map((p) => p[k]).sort((a, b) => a - b)[ring.length >> 1]);
    const fg = (x, y) => { const p = at(x, y); return Math.abs(p[0] - med[0]) + Math.abs(p[1] - med[1]) + Math.abs(p[2] - med[2]) > 60; };
    const rows = [], cols = new Array(W).fill(0);
    for (let y = 0; y < H; y++) { let n = 0; for (let x = 0; x < W; x++) if (fg(x, y)) { n++; cols[x]++; } rows.push(n / W); }
    const on = (arr, lim) => { const i0 = arr.findIndex((v) => v > lim), i1 = arr.length - 1 - [...arr].reverse().findIndex((v) => v > lim); return i0 < 0 ? null : [i0, i1]; };
    const ry = on(rows, 0.25), rx = on(cols.map((c) => c / H), 0.25);
    let x0 = 0, y0 = 0, x1 = W, y1 = H;
    if (ry && rx && (rx[1] - rx[0]) > W * 0.25 && (ry[1] - ry[0]) > H * 0.25) { [x0, x1] = rx; [y0, y1] = ry; }
    // grow to a 5:7 card shape around the found block, inside the photo
    let w = x1 - x0, h = y1 - y0, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    if (w / h > 5 / 7) h = w * 7 / 5; else w = h * 5 / 7;
    w = Math.min(w, W, H * 5 / 7); h = w * 7 / 5;

    return { x: x / s, y: y / s, w: w / s, h: h / s };
  }
  // Show the photo with a card-shaped crop box: drag to move, drag the corner to resize. Resolves with the cropped JPEG.
  function cropper(bmp) {
    return new Promise((done) => {
      const r = autoRect(bmp), view = Math.min(320, innerWidth - 60), sc = view / Math.max(bmp.width, bmp.height * 0.8);
      const vw = Math.round(bmp.width * sc), vh = Math.round(bmp.height * sc);
      const box = { x: r.x * sc, y: r.y * sc, w: r.w * sc };
      const w = document.createElement("div");
      w.className = "sheet crop-sheet";
      w.innerHTML = `<div class="crop"><h2>Fit the card</h2><p class="hint">We found the card. Drag the box to move it, drag the corner to resize.</p>
        <div class="crop-stage" style="width:${vw}px;height:${vh}px"><canvas width="${vw}" height="${vh}"></canvas><div class="crop-box"><i class="crop-h"></i></div></div>
        <div class="acts"><button type="button" class="primary" id="c-ok">Use crop</button><button type="button" id="c-all">Use whole photo</button></div></div>`;
      document.body.appendChild(w);
      w.querySelector("canvas").getContext("2d").drawImage(bmp, 0, 0, vw, vh);
      const el = w.querySelector(".crop-box");
      const place = () => { box.w = Math.max(40, Math.min(box.w, vw, vh * 5 / 7)); box.x = Math.max(0, Math.min(vw - box.w, box.x)); box.y = Math.max(0, Math.min(vh - box.w * 7 / 5, box.y));
        Object.assign(el.style, { left: box.x + "px", top: box.y + "px", width: box.w + "px", height: box.w * 7 / 5 + "px" }); };
      place();
      let drag = null;
      el.addEventListener("pointerdown", (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); drag = { mode: e.target.classList.contains("crop-h") ? "size" : "move", sx: e.clientX, sy: e.clientY, b: { ...box } }; });
      el.addEventListener("pointermove", (e) => {
        if (!drag) return;
        const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
        if (drag.mode === "move") { box.x = drag.b.x + dx; box.y = drag.b.y + dy; } else box.w = drag.b.w + Math.max(dx, dy * 5 / 7);
        place();
      });
      el.addEventListener("pointerup", () => (drag = null));
      const out = (sx, sy, sw, sh) => {
        const cv = document.createElement("canvas"); cv.width = CARD_W; cv.height = CARD_H;
        const g = cv.getContext("2d"); g.fillStyle = "#111"; g.fillRect(0, 0, CARD_W, CARD_H);
        // whole photo: fit it in without stretching; crop: fill the card exactly
        if (sw / sh > CARD_W / CARD_H + 0.01 || sw / sh < CARD_W / CARD_H - 0.01) { const k = Math.min(CARD_W / sw, CARD_H / sh); g.drawImage(bmp, sx, sy, sw, sh, (CARD_W - sw * k) / 2, (CARD_H - sh * k) / 2, sw * k, sh * k); }
        else g.drawImage(bmp, sx, sy, sw, sh, 0, 0, CARD_W, CARD_H);
        let q = 0.85, url = cv.toDataURL("image/jpeg", q);
        while (url.length > 420000 && q > 0.4) { q -= 0.1; url = cv.toDataURL("image/jpeg", q); }
        w.remove(); done(url);
      };
      w.querySelector("#c-ok").onclick = () => out(box.x / sc, box.y / sc, box.w / sc, box.w * 7 / 5 / sc);
      w.querySelector("#c-all").onclick = () => out(0, 0, bmp.width, bmp.height);
    });
  }
  // ---------- automatic straightening: find the card's 4 corners (works when it's tilted or shot at an angle)
  // and warp it flat to an exact 2.5 x 3.5 card. Returns null when it can't find a clear card (then: crop box).
  function findCorners(bmp) {
    const W = 320, s = W / Math.max(bmp.width, bmp.height), w = Math.round(bmp.width * s), h = Math.round(bmp.height * s);
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    const g = cv.getContext("2d", { willReadFrequently: true }); g.drawImage(bmp, 0, 0, w, h);
    const px = g.getImageData(0, 0, w, h).data, col = (i) => [px[i * 4], px[i * 4 + 1], px[i * 4 + 2]];
    // background = the typical color around the photo's edge; "card" = clearly different from it
    const ring = [];
    for (let x = 0; x < w; x += 2) ring.push(col(x), col((h - 1) * w + x));
    for (let y = 0; y < h; y += 2) ring.push(col(y * w), col(y * w + w - 1));
    const med = [0, 1, 2].map((k) => ring.map((p) => p[k]).sort((a, b) => a - b)[ring.length >> 1]);
    const dist = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) dist[i] = Math.abs(px[i * 4] - med[0]) + Math.abs(px[i * 4 + 1] - med[1]) + Math.abs(px[i * 4 + 2] - med[2]);
    const ringD = ring.map((p) => Math.abs(p[0] - med[0]) + Math.abs(p[1] - med[1]) + Math.abs(p[2] - med[2])).sort((a, b) => a - b);
    const thr = Math.max(40, ringD[Math.floor(ringD.length * 0.9)] * 1.5); // above the background's own noise
    const mask = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) mask[i] = dist[i] > thr ? 1 : 0;
    // keep the biggest connected blob (the card), ignore specks
    const lab = new Int32Array(w * h), stack = [];
    let best = 0, bestN = 0, id = 0;
    for (let i = 0; i < w * h; i++) {
      if (!mask[i] || lab[i]) continue;
      id++; let n = 0; stack.push(i); lab[i] = id;
      while (stack.length) {
        const j = stack.pop(); n++;
        const x = j % w, y = (j / w) | 0;
        for (const k of [x > 0 ? j - 1 : -1, x < w - 1 ? j + 1 : -1, y > 0 ? j - w : -1, y < h - 1 ? j + w : -1])
          if (k >= 0 && mask[k] && !lab[k]) { lab[k] = id; stack.push(k); }
      }
      if (n > bestN) { bestN = n; best = id; }
    }
    if (bestN < w * h * 0.08 || bestN > w * h * 0.97) return null; // no clear card in the photo
    // corners = the blob's extreme points along the diagonals (good for tilts up to ~30 degrees)
    let tl = null, tr = null, br = null, bl = null, a = Infinity, b = -Infinity, c = -Infinity, d = Infinity;
    for (let i = 0; i < w * h; i++) {
      if (lab[i] !== best) continue;
      const x = i % w, y = (i / w) | 0;
      if (x + y < a) { a = x + y; tl = [x, y]; }
      if (x + y > b) { b = x + y; br = [x, y]; }
      if (x - y > c) { c = x - y; tr = [x, y]; }
      if (x - y < d) { d = x - y; bl = [x, y]; }
    }
    const q = [tl, tr, br, bl].map(([x, y]) => [x / s, y / s]);
    // sanity: a real card fills most of the quad it spans, and isn't a sliver
    const area = Math.abs(q.reduce((sum, p, i) => { const n = q[(i + 1) % 4]; return sum + p[0] * n[1] - n[0] * p[1]; }, 0)) / 2 * s * s;
    if (area < bestN * 0.75 || area > bestN * 1.35) return null;
    return q;
  }
  // solve the 3x3 perspective map that sends the output rectangle onto the 4 corners
  function homography(src, dst) {
    const A = [], B = [];
    for (let i = 0; i < 4; i++) {
      const [x, y] = src[i], [u, v] = dst[i];
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); B.push(u);
      A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); B.push(v);
    }
    for (let i = 0; i < 8; i++) { // Gaussian elimination with pivoting
      let p = i; for (let r = i + 1; r < 8; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r;
      [A[i], A[p]] = [A[p], A[i]]; [B[i], B[p]] = [B[p], B[i]];
      for (let r = 0; r < 8; r++) { if (r === i) continue; const f = A[r][i] / A[i][i]; for (let k = i; k < 8; k++) A[r][k] -= f * A[i][k]; B[r] -= f * B[i]; }
    }
    return B.map((v, i) => v / A[i][i]).concat(1);
  }
  function straighten(bmp, q) {
    // portrait card: if the found shape is wider than tall (a horizontal card or a sideways photo), turn it upright
    const len = (p, r) => Math.hypot(p[0] - r[0], p[1] - r[1]);
    if ((len(q[0], q[1]) + len(q[3], q[2])) > (len(q[0], q[3]) + len(q[1], q[2]))) q = [q[3], q[0], q[1], q[2]];
    // pull the corners in by 1% so no background slips in along the edges
    const cx = q.reduce((s2, p) => s2 + p[0], 0) / 4, cy = q.reduce((s2, p) => s2 + p[1], 0) / 4;
    q = q.map(([x, y]) => [x + (cx - x) * 0.012, y + (cy - y) * 0.012]);
    const S = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)), sw = Math.round(bmp.width * S), sh = Math.round(bmp.height * S);
    const sc = document.createElement("canvas"); sc.width = sw; sc.height = sh;
    const sg = sc.getContext("2d", { willReadFrequently: true }); sg.drawImage(bmp, 0, 0, sw, sh);
    const src = sg.getImageData(0, 0, sw, sh).data;
    const H = homography([[0, 0], [CARD_W, 0], [CARD_W, CARD_H], [0, CARD_H]], q.map(([x, y]) => [x * S, y * S]));
    const out = document.createElement("canvas"); out.width = CARD_W; out.height = CARD_H;
    const og = out.getContext("2d"), img = og.createImageData(CARD_W, CARD_H), o = img.data;
    for (let y = 0; y < CARD_H; y++) for (let x = 0; x < CARD_W; x++) {
      const z = H[6] * x + H[7] * y + H[8], u = (H[0] * x + H[1] * y + H[2]) / z, v = (H[3] * x + H[4] * y + H[5]) / z;
      const x0 = Math.max(0, Math.min(sw - 2, u | 0)), y0 = Math.max(0, Math.min(sh - 2, v | 0)), fx = Math.min(1, Math.max(0, u - x0)), fy = Math.min(1, Math.max(0, v - y0));
      const i00 = (y0 * sw + x0) * 4, i10 = i00 + 4, i01 = i00 + sw * 4, i11 = i01 + 4, k = (y * CARD_W + x) * 4;
      for (let ch = 0; ch < 3; ch++) o[k + ch] = (src[i00 + ch] * (1 - fx) + src[i10 + ch] * fx) * (1 - fy) + (src[i01 + ch] * (1 - fx) + src[i11 + ch] * fx) * fy;
      o[k + 3] = 255;
    }
    og.putImageData(img, 0, 0);
    let qq = 0.85, url = out.toDataURL("image/jpeg", qq);
    while (url.length > 420000 && qq > 0.4) { qq -= 0.1; url = out.toDataURL("image/jpeg", qq); }
    return url;
  }
  // pull what we can out of a listing title: "2023 Panini Prizm C.J. Stroud Silver Prizm RC #339 /99 Auto"
  function fromTitle(t) {
    const y = (t.match(/(?:^|\s)((?:19|20)\d{2})(?=[\s-])/) || [])[1];
    const serial = (t.match(/\/\s?(\d{1,4})(?!\d)/) || [])[1];
    return { year: y || "", rookie: /\s(RC|rookie)(\s|$)/i.test(" " + t + " "), auto: /auto/i.test(t), serial: serial ? "/" + serial : "" };
  }
  function editor(c) {
    c = c || {};
    const w = document.createElement("div");
    w.className = "sheet";
    const photo = (k, label) => `<label class="photo" id="ph-${k}" style="${c[k] ? `background-image:url('${c[k]}')` : ""}"><span>${c[k] ? "" : label}</span>
      <input type="file" accept="image/*" data-k="${k}" aria-label="${label}"></label>`;
    w.innerHTML = `<form>
      <h2>${c.id ? "Edit card" : "Add a card"}</h2>
      ${SEARCH ? `<div class="srch"><div class="srch-bar"><input type="search" id="s-q" placeholder="Search eBay: 2023 Prizm Stroud Silver" aria-label="Search for the card">
        <button type="button" id="s-go">Search</button></div><div class="srch-res" id="s-res"></div><p class="hint" id="s-from"></p></div>
        <p class="hint">Or use your own photos:</p>` : ""}
      <div class="photos"><div class="pcell">${photo("front", "Tap to add the front")}</div><div class="pcell">${photo("back", "Tap to add the back (optional)")}</div></div>
      <div class="row2"><label class="f">Player<input name="player" required value="${esc(c.player)}" placeholder="C.J. Stroud"></label>
        <label class="f">Team<input name="team" list="team-list" value="${esc(c.team)}" placeholder="Houston Texans"></label>
        <datalist id="team-list">${TEAMS.map((t) => `<option value="${esc(t.name)}">`).join("")}</datalist></div>
      <div class="row2"><label class="f">Year<input name="year" inputmode="numeric" value="${esc(c.year)}" placeholder="2023"></label>
        <label class="f">Set<input name="set" value="${esc(c.set)}" placeholder="Panini Prizm"></label></div>
      <div class="row2"><label class="f">Parallel / insert<input name="parallel" value="${esc(c.parallel)}" placeholder="Silver"></label>
        <label class="f">Serial #<input name="serial" value="${esc(c.serial)}" placeholder="/99"></label></div>
      <div class="row2"><label class="f">Grade<input name="grade" value="${esc(c.grade)}" placeholder="PSA 10"></label>
        <label class="f">Notes<input name="notes" value="${esc(c.notes)}" placeholder="Pulled it myself"></label></div>
      <div class="checks"><label><input type="checkbox" name="rookie" ${c.rookie ? "checked" : ""}> Rookie</label>
        <label><input type="checkbox" name="auto" ${c.auto ? "checked" : ""}> Auto</label>
        <label><input type="checkbox" name="grail" ${c.grail ? "checked" : ""}> My grail (featured at the top)</label></div>
      <div class="status" id="st"></div>
      <div class="acts"><button type="submit" class="primary">Save card</button><button type="button" id="x">Cancel</button></div></form>`;
    document.body.appendChild(w);
    const imgs = { front: c.front || "", back: c.back || "" }, st = w.querySelector("#st");
    // every photo (yours or a listing's) goes through the card cropper: background trimmed, card-shaped
    // automatic: find the card, straighten it, done. The crop box only opens if no clear card is found,
    // or if you tap "Adjust" under the photo.
    const bmps = {};
    const show = (k) => { const ph = w.querySelector("#ph-" + k); ph.style.backgroundImage = `url('${imgs[k]}')`; ph.querySelector("span").textContent = "";
      let adj = w.querySelector("#adj-" + k);
      if (!adj) { adj = document.createElement("button"); adj.type = "button"; adj.id = "adj-" + k; adj.className = "adj"; adj.textContent = "Adjust"; ph.after(adj);
        adj.onclick = async () => { if (bmps[k]) { imgs[k] = await cropper(bmps[k]); show(k); } }; } };
    const setPhoto = async (k, src) => {
      st.textContent = "Finding and straightening the card…";
      try {
        const bmp = bmps[k] = await bitmapOf(src);
        await new Promise((r) => setTimeout(r, 30)); // let the message paint before the heavy lifting
        const q = findCorners(bmp);
        imgs[k] = q ? straighten(bmp, q) : await cropper(bmp);
        show(k);
        st.textContent = q ? "Card found and straightened. Tap Adjust if it's off." : "";
      } catch (e) { st.textContent = "That photo couldn't be read. Try a JPEG or a screenshot."; }
    };
    w.querySelectorAll("input[type=file]").forEach((inp) => inp.onchange = () => { const f = inp.files[0]; if (f) setPhoto(inp.dataset.k, f); });
    if (SEARCH) {
      const res = w.querySelector("#s-res"), q = w.querySelector("#s-q");
      let found = [];
      const go = async () => {
        if (!q.value.trim()) return;
        res.innerHTML = `<p class="hint">Searching…</p>`;
        try {
          found = (await (await fetch(SEARCH + "/search?q=" + encodeURIComponent(q.value.trim()))).json()).items || [];
          res.innerHTML = found.map((it, i) => `<button type="button" class="srch-hit" data-i="${i}" title="${esc(it.title)}"><img src="${esc(SEARCH + "/img?u=" + encodeURIComponent(it.image))}" alt="" loading="lazy"><span>${esc(it.title)}</span></button>`).join("")
            || `<p class="hint">No listings found. Try fewer words.</p>`;
        } catch (e) { res.innerHTML = `<p class="hint">Search isn't working right now (${esc(e.message)}).</p>`; }
      };
      w.querySelector("#s-go").onclick = go;
      q.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); go(); } };
      res.onclick = async (e) => {
        const b = e.target.closest("[data-i]"); if (!b) return;
        const it = found[+b.dataset.i], f = w.querySelector("form"), t = fromTitle(it.title);
        if (t.year && !f.year.value) f.year.value = t.year;
        if (t.serial && !f.serial.value) f.serial.value = t.serial;
        if (t.rookie) f.rookie.checked = true;
        if (t.auto) f.auto.checked = true;
        w.querySelector("#s-from").textContent = "From eBay: " + it.title;
        res.innerHTML = "";
        await setPhoto("front", SEARCH + "/img?u=" + encodeURIComponent(it.image));
      };
    }
    w.querySelector("#x").onclick = () => w.remove();
    w.addEventListener("click", (e) => { if (e.target === w) w.remove(); });
    w.querySelector("form").onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target), data = {};
      for (const k of ["player", "team", "year", "set", "parallel", "serial", "grade", "notes"]) data[k] = (fd.get(k) || "").trim();
      data.year = data.year ? +data.year || data.year : "";
      for (const k of ["rookie", "auto", "grail"]) data[k] = !!fd.get(k);
      data.front = imgs.front; data.back = imgs.back;
      if (!data.front) { st.textContent = "Add a photo of the front first."; return; }
      st.textContent = "Saving…";
      try {
        if (data.grail) for (const g of cards.filter((x) => x.grail && x.id !== c.id)) await db.collection("pc").doc(g.id).update({ grail: false }); // one grail at a time
        if (c.id) await db.collection("pc").doc(c.id).update(data);
        else await db.collection("pc").add({ ...data, added: Date.now() });
        w.remove();
        load();
      } catch (err) { st.textContent = "Couldn't save (" + (err.code || err.message) + "). Check that the Firebase rules were published."; }
    };
  }
  $("#add").onclick = () => editor();
  document.addEventListener("click", async (e) => {
    const ed = e.target.closest("[data-edit]"), del = e.target.closest("[data-del]");
    if (ed) editor(cards.find((c) => c.id === ed.dataset.edit));
    if (del) {
      if (del.dataset.sure !== "1") { del.dataset.sure = "1"; del.textContent = "Sure?"; setTimeout(() => { del.dataset.sure = ""; del.textContent = "Delete"; }, 3000); return; }
      await db.collection("pc").doc(del.dataset.del).delete().catch(() => {});
      load();
    }
  });

  load();
})();
</script>
