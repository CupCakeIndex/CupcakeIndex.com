name: Visualize data

# Game-by-game team and player stats for Stats > Visualize (src/viz_data.py -> docs/data/viz/).
# Every morning in season (8:40 AM Eastern), so the stats and the Cupcake Analyst never lag more than a day: Sunday has
# Saturday's college games, Monday Sunday's NFL games, Tuesday Monday night, Friday Thursday night. Run it any time: Actions tab > "Visualize data" > Run workflow.
# The log ends with a check of season totals against ESPN's ("0 gap(s) over 2%" = the numbers match).

on:
  schedule:
    - cron: "40 12 * 8-12,1 *"   # every day, 8:40 AM Eastern
  workflow_dispatch:
    inputs:
      league:
        description: "Which league"
        type: choice
        default: all
        options: [all, nfl, cfb]

permissions:
  contents: write

concurrency:
  group: viz-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: viz-raw-${{ github.run_id }}
          restore-keys: viz-raw-
      - name: Build the chart data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          LEAGUE: ${{ inputs.league || 'all' }}
        run: python src/viz_data.py --league "$LEAGUE"
      - name: Pass, target and rush charts (NFL player pages)
        continue-on-error: true
        if: ${{ (inputs.league || 'all') != 'cfb' }}
        run: python src/pass_charts.py
      - name: Cupcake Analyst data
        # analyst/data/rankings.json for Terry's private claude.ai fact-check page. The "Refresh Cupcake Analyst"
        # cloud routine publishes it ~2 hours later, every day (that sandbox can't download nflverse injuries/depth charts).
        continue-on-error: true
        run: python src/analyst_data.py
      - name: Coach profiles (offense or defense background, and each current coach's scheme tendencies)
        continue-on-error: true
        run: python src/coach_profile.py
      - name: Higher or Lower game cards (finished seasons only, so this only changes once a year)
        continue-on-error: true
        run: python src/hilo_data.py
      - name: Dynasty Draft team grades (finished seasons only, so this only changes once a year)
        continue-on-error: true
        run: python src/dynasty_data.py
      - name: NFL records players hold (gold on player pages; from Wikipedia's record lists)
        continue-on-error: true
        run: python src/nfl_records.py
      - name: Heisman race popularity (Wikipedia page views for college stars)
        continue-on-error: true
        run: python src/heisman_buzz.py
      - name: NFL trade watch (who gets traded before the deadline, and where)
        continue-on-error: true
        run: python src/trade_watch.py --until-deadline
      - name: Mock draft (our two-round NFL mock and the Be the GM board; draft order from our season sims, prospects from draft headlines)
        continue-on-error: true
        run: python src/mock_draft.py
      - name: College portal watch (who enters the transfer portal, and where)
        continue-on-error: true
        run: python src/portal_watch.py
      - name: Publish
        run: |
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add docs/data/viz
          git add docs/data/nfl/*/charts docs/data/nfl/kicks_index.json 2>/dev/null || true
          git add analyst/data/rankings.json 2>/dev/null || true
          git add docs/data/coach_profile.json 2>/dev/null || true
          git add docs/data/hilo.json 2>/dev/null || true
          git add docs/data/dynasty.json 2>/dev/null || true
          git add docs/data/nfl/mock_draft.json 2>/dev/null || true
          git add docs/data/nfl/records.json 2>/dev/null || true
          git add docs/data/nfl/ol_stats.json 2>/dev/null || true
          git add docs/data/cfb/heisman_buzz.json 2>/dev/null || true
          git add docs/data/nfl/trade_watch.json 2>/dev/null || true
          git add docs/data/cfb/portal_watch.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Visualize data $(date -u +%Y-%m-%dT%H:%MZ)"
          for try in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 10; done
          exit 1
