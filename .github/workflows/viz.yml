name: Visualize data

# Game-by-game team and player stats for Stats > Visualize (src/viz_data.py -> docs/data/viz/).
# Sunday after the college games, Monday after Sunday's NFL games, Tuesday after Monday Night Football, Friday after Thursday night. Run it any time: Actions tab > "Visualize data" > Run workflow.
# The log ends with a check of season totals against ESPN's ("0 gap(s) over 2%" = the numbers match).

on:
  schedule:
    - cron: "40 12 * 8-12,1 0"   # Sunday 8:40 AM Eastern
    - cron: "40 12 * 8-12,1 1"   # Monday 8:40 AM Eastern (Sunday's NFL games)
    - cron: "40 12 * 8-12,1 2"   # Tuesday 8:40 AM Eastern
    - cron: "40 12 * 8-12,1 5"   # Friday 8:40 AM Eastern (Thursday night's game)
  workflow_dispatch:
    inputs:
      league:
        description: "Which league"
        type: choice
        default: all
        options: [all, nfl, cfb]

permissions:
  contents: write

concurrency:
  group: viz-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: viz-raw-${{ github.run_id }}
          restore-keys: viz-raw-
      - name: Build the chart data
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          LEAGUE: ${{ inputs.league || 'all' }}
        run: python src/viz_data.py --league "$LEAGUE"
      - name: Pass, target and rush charts (NFL player pages)
        continue-on-error: true
        if: ${{ (inputs.league || 'all') != 'cfb' }}
        run: python src/pass_charts.py
      - name: Cupcake Analyst data
        # analyst/data/rankings.json for Terry's private claude.ai fact-check page. The "Refresh Cupcake Analyst"
        # cloud routine publishes it ~2 hours later (that sandbox can't download nflverse injuries/depth charts).
        continue-on-error: true
        run: python src/analyst_data.py
      - name: Publish
        run: |
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add docs/data/viz
          git add docs/data/nfl/*/charts 2>/dev/null || true
          git add analyst/data/rankings.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Visualize data $(date -u +%Y-%m-%dT%H:%MZ)"
          for try in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 10; done
          exit 1
