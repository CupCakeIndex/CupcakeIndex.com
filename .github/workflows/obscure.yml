name: Obscure stat post

# Stat / hot-take posts for X. Runs twice a day on its own (1 PM and 7 PM Eastern, Aug-Jan), walking through
# every stat in a fixed order so nothing repeats for about two weeks. You can also run it any time:
# Actions tab > "Obscure stat post" > Run workflow, and pick a stat, a look, or untick "Post to X" to just make the picture.
# No link in the post, 280 characters max. Betting hot takes say "for fun, not betting advice".
# Posting follows the same switch as the daily posts: repo variable X_POSTING_ENABLED must be "true".

on:
  schedule:
    - cron: "2 17 * 8-12,1 *"   # 1 PM Eastern (noon in winter)
    - cron: "2 23 * 8-12,1 *"   # 7 PM Eastern (6 PM in winter)
    - cron: "30 14 * 9-12,1 6"  # Saturday 10:30 AM Eastern: NFL injury report (most banged-up teams), after Friday's final reports
    - cron: "17 18 * 9-12,1 3"  # Wednesday 2:17 PM Eastern: weekly NFL Fraud watch (vs ESPN projections, with the day-job meme)
    - cron: "17 18 * 9-12,1 4"  # Thursday 2:17 PM Eastern: weekly NFL Over-achievers
  workflow_dispatch:
    inputs:
      stat:
        description: "Which stat (random = any; random-hot = hot takes only)"
        type: choice
        default: random
        options:
          - random
          - random-hot
          - random-stat
          - nfl_injuries
          - weekly_frauds
          - weekly_overachievers
          - hot_cfb_paper_unbeaten
          - hot_cfb_beaten_nobody
          - hot_nfl_paper_record
          - hot_cfb_ap_overrated
          - hot_cfb_ap_snub
          - hot_nfl_record_lies
          - hot_nfl_better_than_record
          - hot_nfl_close_calls
          - hot_nfl_empty_yards
          - hot_nfl_vs_vegas
          - hot_cfb_vs_vegas
          - hot_nfl_upset_alert
          - hot_cfb_upset_alert
          - cfb_toughest_left
          - cfb_easiest_left
          - nfl_toughest_left
          - nfl_easiest_left
          - nfl_one_score_games
          - cfb_biggest_blowout
          - nfl_qb_rush
          - nfl_rb_receiving
          - nfl_interceptions
          - nfl_catches_no_td
          - nfl_yards_per_carry
          - nfl_yards_per_catch
          - nfl_completion_pct
          - nfl_te_touchdowns
          - cfb_qb_rush
          - cfb_rb_receiving
          - cfb_pass_td_pace
          - cfb_yards_per_catch
      theme:
        description: "Card look (a site theme; random = surprise me)"
        type: choice
        default: random
        options: [random, mono, terminal, amber, broadcast, editorial, glass, varsity]
      post:
        description: "Post to X (untick to only make the picture)"
        type: boolean
        default: true

permissions:
  contents: write   # commits data/social/posted.json after a post

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r src/social/requirements.txt
      - name: Render the stat card
        env:
          STAT: ${{ github.event.schedule == '30 14 * 9-12,1 6' && 'nfl_injuries' || github.event.schedule == '17 18 * 9-12,1 3' && 'weekly_frauds' || github.event.schedule == '17 18 * 9-12,1 4' && 'weekly_overachievers' || inputs.stat || 'rotate' }}
          THEME: ${{ inputs.theme || 'random' }}
        run: python src/social/obscure.py --stat "$STAT" --theme "$THEME"
      - uses: actions/upload-artifact@v4
        with:
          name: obscure-stat
          path: out/social/
          retention-days: 14
      - name: Post to X
        # scheduled runs always post; manual runs post unless "Post to X" is unticked
        if: (github.event_name == 'schedule' || inputs.post) && vars.X_POSTING_ENABLED == 'true'
        env:
          X_POSTING_ENABLED: ${{ vars.X_POSTING_ENABLED }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python src/social/post_to_x.py --meta out/social/today.json
      - name: Save the posting log (so nothing repeats)
        if: success()
        run: bash src/social/save_log.sh
