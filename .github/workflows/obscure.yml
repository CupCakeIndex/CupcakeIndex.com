name: Obscure stat post

# On demand only: Actions tab > "Obscure stat post" > Run workflow.
# Picks a weird stat or a hot take (or the one you choose), renders the card with the player's
# headshot / team logo, and posts it to X. No link in the post, 280 characters max.
# Posting follows the same switch as the daily posts: repo variable X_POSTING_ENABLED must be "true".
# Untick "Post to X" to only make the picture (download it from the run's Artifacts).

on:
  workflow_dispatch:
    inputs:
      stat:
        description: "Which stat (random = any of them)"
        type: choice
        default: random
        options:
          - random
          - random-hot
          - random-obscure
          - hot_cfb_beaten_nobody
          - hot_cfb_ap_snub
          - hot_cfb_paper_unbeaten
          - hot_nfl_record_lies
          - hot_nfl_better_than_record
          - hot_nfl_lucky_record
          - hot_nfl_empty_yards
          - hot_nfl_volume_merchant
          - nfl_yards_per_catch
          - nfl_qb_rush
          - nfl_rb_receiving
          - nfl_catch_rate
          - nfl_yards_per_carry
          - nfl_td_rate
          - nfl_int_thrown
          - nfl_td_per_touch
          - nfl_te_touchdowns
          - nfl_completion_pct
          - nfl_targets_no_td
          - nfl_yards_per_target
          - cfb_qb_rush
          - cfb_yards_per_catch
          - cfb_rb_receiving
          - cfb_pass_td_pace
          - cfb_td_per_catch
          - cfb_wr_rushing
          - cfb_luckiest
          - nfl_unluckiest
          - cfb_ap_overrated
          - cfb_hardest_left
          - nfl_easiest_left
          - nfl_one_score
          - cfb_biggest_win
          - nfl_toughest_so_far
      theme:
        description: "Card look (a site theme; random = surprise me)"
        type: choice
        default: random
        options: [random, mono, terminal, amber, broadcast, editorial, glass, varsity]
      post:
        description: "Post to X (untick to only make the picture)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r src/social/requirements.txt
      - name: Render the stat card
        run: python src/social/obscure.py --stat "${{ inputs.stat }}" --theme "${{ inputs.theme }}"
      - uses: actions/upload-artifact@v4
        with:
          name: obscure-stat
          path: out/social/
          retention-days: 14
      - name: Post to X
        if: inputs.post && vars.X_POSTING_ENABLED == 'true'   # post_to_x.py double-checks this and the secrets
        env:
          X_POSTING_ENABLED: ${{ vars.X_POSTING_ENABLED }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python src/social/post_to_x.py --meta out/social/today.json
