name: Mock draft

# Our two-round NFL mock and the Be the GM board (src/mock_draft.py -> docs/data/nfl/mock_draft.json).
# Every day, all year, so traded picks and new draft headlines show up the next morning (9:20 AM Eastern, after the
# Visualize job). It stops on its own after the draft and picks back up when the next season starts.
# Run it any time: Actions tab > "Mock draft" > Run workflow.

on:
  schedule:
    - cron: "20 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mock-draft
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: mock-raw-${{ github.run_id }}
          restore-keys: mock-raw-
      - name: Build the mock draft
        run: python src/mock_draft.py
      - name: Publish
        run: |
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add docs/data/nfl/mock_draft.json docs/data/nfl/mock_pool.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Mock draft $(date -u +%Y-%m-%dT%H:%MZ)"
          for try in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 10; done
          exit 1
