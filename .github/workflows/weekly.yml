name: Weekly rankings

on:
  schedule:
    # College only, Saturday night alongside the Bully (11:27 PM, 12:57 AM, 2:27 AM Eastern). A week only counts
    # once 90% of its games are final, so the later tries pick up the late West Coast games.
    - cron: "27 3 * 8-10 0"
    - cron: "57 4 * 8-10 0"
    - cron: "27 6 * 8-10 0"
    - cron: "27 4 * 11,12,1 0"
    - cron: "57 5 * 11,12,1 0"
    - cron: "27 7 * 11,12,1 0"
    # Sundays 11:23 UTC (7am Eastern): college only, a final pass with every Saturday game.
    - cron: "23 11 * 8-12,1 0"
    # Sunday night, college only: picks up the new AP and Coaches polls (out Sunday afternoon; CFBD posts them a few hours later).
    # 23:17 UTC = 7:17 PM EDT / 6:17 PM EST; 01:47 UTC Monday = 9:47 PM EDT / 8:47 PM EST Sunday (the backup try).
    - cron: "17 23 * 8-12,1 0"
    - cron: "47 1 * 8-12,1 1"
    # Mondays 13:07 UTC (9am Eastern), Aug-Jan only. Tuesday run picks up late stat corrections.
    # Minutes are off the top of the hour, when GitHub's scheduler is busiest (it skipped runs on Oct 4).
    - cron: "7 13 * 8-12,1 1"
    - cron: "7 13 * 8-12,1 2"
    # Right after Monday Night Football (Terry): NFL only, Tuesday 05:47 UTC = 1:47 AM EDT / 12:47 AM EST, after the last
    # Monday game ends, so the rankings include it overnight instead of waiting for Tuesday 9am.
    - cron: "47 5 * 9-12,1 2"
    # NFL prediction refreshes after the injury reports (minute 37 = NFL only, rankings date left alone):
    # Thursday 18:37 UTC for Thursday night, Sunday 14:37 UTC (10:37am EDT / 9:37am EST) for Sunday and Monday.
    - cron: "37 18 * 9-12,1 4"
    - cron: "37 14 * 9-12,1 0"
    # College prediction refreshes after the availability reports (minute 38 = college only, rankings date left alone):
    # Friday 22:38 UTC (the day-before reports) and Saturday 14:38 UTC (10:38am EDT, before the noon games).
    - cron: "38 22 * 8-12,1 5"
    - cron: "38 14 * 8-12,1 6"
  workflow_dispatch:          # "Run workflow" button on GitHub
    inputs:
      season:
        description: "Season to rebuild (blank = current)"
        required: false
      league:
        description: "League (all, cfb or nfl)"
        required: false
        default: all

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore ESPN box score cache (CFB projections)
        uses: actions/cache@v4
        with:
          path: data/raw/espn_cfb
          key: espn-cfb-${{ github.run_id }}
          restore-keys: espn-cfb-
      - name: Build rankings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SEASON: ${{ inputs.season }}
          LEAGUE: ${{ github.event_name == 'schedule' && (startsWith(github.event.schedule, '37 ') || startsWith(github.event.schedule, '47 5 ')) && 'nfl' || github.event_name == 'schedule' && !startsWith(github.event.schedule, '7 13') && 'cfb' || inputs.league || 'all' }}
          KEEP_DATE: ${{ github.event_name == 'schedule' && (startsWith(github.event.schedule, '37 ') || startsWith(github.event.schedule, '38 ')) && '--keep-date' || '' }}
        run: |
          [[ "$LEAGUE" =~ ^(all|cfb|nfl)$ ]] || LEAGUE=all
          if [[ "$SEASON" =~ ^[0-9]{4}$ ]]; then python src/run_weekly.py --league "$LEAGUE" --season "$SEASON" $KEEP_DATE; else python src/run_weekly.py --league "$LEAGUE" $KEEP_DATE; fi
      - name: Just the Facts (team pages) from the college game history
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python src/social/cupcake_history.py && python src/social/team_facts.py || echo "College facts skipped this time"
          python src/social/nfl_facts.py || echo "NFL facts skipped this time"
          python src/social/h2h.py || echo "Last 5 meetings skipped this time"  # game pages (after cupcake_history.py)
          python src/team_meta.py || echo "Team list skipped this time"   # favorite-team picker + Team theme colors
          python src/nfl_starts.py || echo "NFL starts skipped this time"  # who started each game (Injuries: key players on IR)
          python src/starters.py || echo "Conversation starters skipped this time"  # top-25 Takes tabs (after facts.json)
          python src/coaches.py || echo "Coach rankings skipped this time"  # Coaches page + hot seat (after cupcake_history.py)
          python src/coach_tree.py || echo "Coaching trees skipped this time"  # coach pages: trees + photos (Wikipedia, cached a month)
      - name: Publish
        run: |
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add docs/data data/history
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Rankings update $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
