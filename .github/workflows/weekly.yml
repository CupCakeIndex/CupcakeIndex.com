name: Weekly rankings

on:
  schedule:
    # Sundays 11:23 UTC (7am Eastern): college only, so CFB rankings are up the morning after Saturday's games.
    - cron: "23 11 * 8-12,1 0"
    # Mondays 13:07 UTC (9am Eastern), Aug-Jan only. Tuesday run picks up late stat corrections.
    # Minutes are off the top of the hour, when GitHub's scheduler is busiest (it skipped runs on Oct 4).
    - cron: "7 13 * 8-12,1 1"
    - cron: "7 13 * 8-12,1 2"
  workflow_dispatch:          # "Run workflow" button on GitHub
    inputs:
      season:
        description: "Season to rebuild (blank = current)"
        required: false
      league:
        description: "League (all, cfb or nfl)"
        required: false
        default: all

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore ESPN box score cache (CFB projections)
        uses: actions/cache@v4
        with:
          path: data/raw/espn_cfb
          key: espn-cfb-${{ github.run_id }}
          restore-keys: espn-cfb-
      - name: Build rankings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SEASON: ${{ inputs.season }}
          LEAGUE: ${{ github.event.schedule == '23 11 * 8-12,1 0' && 'cfb' || inputs.league || 'all' }}
        run: |
          [[ "$LEAGUE" =~ ^(all|cfb|nfl)$ ]] || LEAGUE=all
          if [[ "$SEASON" =~ ^[0-9]{4}$ ]]; then python src/run_weekly.py --league "$LEAGUE" --season "$SEASON"; else python src/run_weekly.py --league "$LEAGUE"; fi
      - name: Just the Facts (team pages) from the college game history
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python src/social/cupcake_history.py && python src/social/team_facts.py || echo "College facts skipped this time"
          python src/social/nfl_facts.py || echo "NFL facts skipped this time"
          python src/team_meta.py || echo "Team list skipped this time"   # favorite-team picker + Team theme colors
          python src/nfl_starts.py || echo "NFL starts skipped this time"  # who started each game (Injuries: key players on IR)
      - name: Publish
        run: |
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add docs/data data/history
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Rankings update $(date -u +%Y-%m-%d)"
          git push
