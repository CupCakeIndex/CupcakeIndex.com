name: Hourly news

# Collects football headlines from public RSS feeds into docs/data/news.json for the News tab.
# Browsers can't read those feeds directly (CORS), so we fetch them here and commit the result.
# Then posts the biggest fresh headline to X, if there is one (src/social/breaking.py: season-ending injuries,
# coaches fired/hired, trades, big contracts, star injuries; credits the source; big news only, at most 3 a day).

on:
  schedule:
    - cron: "17,47 * * * *"   # every half hour (off the busy top of the hour), so breaking news posts go out fast
  workflow_dispatch:          # "Run workflow" button on GitHub

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r src/social/requirements.txt
      - name: Fetch headlines
        run: python src/news.py
      - name: Football card releases (once a day, the 12:00 UTC run)
        run: |
          if [ "$(date -u +%H)" = "12" ] || [ ! -f docs/data/cards.json ]; then python src/cards.py || echo "Card calendar unavailable"; fi
      - name: Publish
        run: |
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add docs/data/news.json docs/data/cards.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "News update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
      - name: Breaking news post (only real news, big news only, at most 3 a day)
        if: success()
        run: python src/social/breaking.py --out out/social
      - name: Post to X
        if: success() && vars.X_POSTING_ENABLED == 'true' && hashFiles('out/social/today.json') != ''
        env:
          X_POSTING_ENABLED: ${{ vars.X_POSTING_ENABLED }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python src/social/post_to_x.py --meta out/social/today.json
      - name: Save the posting log
        if: success() && hashFiles('out/social/today.json') != ''
        run: bash src/social/save_log.sh
      - name: Alert phones (Settings > Alerts; every breaking headline, not just the ones posted to X; each goes out once)
        if: ${{ !cancelled() }}
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install -q pywebpush google-auth tzdata
          python src/push.py news
