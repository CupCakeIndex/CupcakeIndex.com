name: Alerts

# Phone/browser alerts (Settings > Alerts on the site) for the teams each person follows: "Kickoff soon",
# every score change, and the final; injury status changes and the daily (10 AM Eastern) injury report.
# Plus the Saturday-night "Pick'em locks tonight" reminder.
# Bully of the Week alerts go out from bully.yml and social.yml right after their X posts; breaking news from news.yml.
# See src/push.py. Every 5 minutes during the season (GitHub's shortest, and it sometimes runs late);
# with no game about to start, on or just finished, a run is over in a few seconds.
# Run it by hand: Actions > Alerts > Run workflow ("test" sends a test alert to every device).

on:
  schedule:
    - cron: "2-59/5 * * 8-12,1,2 *"
  workflow_dispatch:
    inputs:
      what:
        description: "What to send"
        type: choice
        default: test
        options: [test, auto, picks, list, announce]

permissions:
  contents: read   # what's been sent is kept in Firebase (pushstate/log), not the repo

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pywebpush google-auth requests tzdata
      - name: Send alerts
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          WHAT: ${{ inputs.what || 'auto' }}
        run: |
          if [ "$WHAT" = "picks" ]; then python src/push.py picks --force; else python src/push.py "$WHAT"; fi
