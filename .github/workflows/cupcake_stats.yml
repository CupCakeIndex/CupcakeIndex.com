name: Cupcake stat post

# Cupcake stats: droughts and résumés only our model can make (src/social/cupcake_stats.py).
# Posts once a day: weekdays 3 PM Eastern (the strongest stat not posted yet), Saturday 9:30 AM (college game-day
# droughts and series), Sunday 9:30 AM (NFL series and playoff droughts). It won't post if the game history is incomplete or nothing clears the bar,
# and never repeats itself (data/social/posted.json).
# Manual: Actions tab > "Cupcake stat post" > Run workflow. Leave "Post to X" unticked to only make drafts
# (download "cupcake-drafts" from the finished run and read drafts.md).
# The first run also downloads college game history back to 2005 (about 60 CollegeFootballData calls,
# once) and saves it in data/history/cfb/ so later runs only refresh the current season.

on:
  schedule:
    - cron: "3 19 * 8-12,1 1-5"   # Monday-Friday 3 PM Eastern (2 PM in winter): the strongest stat not posted yet
    - cron: "30 13 * 8-12,1 6"    # Saturday 9:30 AM Eastern: this week's college droughts / series, before kickoff
    - cron: "30 13 * 8-12,1 0"    # Sunday 9:30 AM Eastern: this week's NFL series / playoff droughts, before kickoff
  workflow_dispatch:
    inputs:
      stat:
        description: "Which stat (best = the strongest one right now)"
        type: choice
        default: best
        options: [best, bully_drought, week_drought, series_week, soft_unbeaten, top25_test, cupcake_streak, top10_drought, nfl_series_week, nfl_playoff_drought, nfl_primetime_record, nfl_top8_test]
      theme:
        description: "Card look (a site theme; random = surprise me)"
        type: choice
        default: random
        options: [random, mono, terminal, amber, broadcast, editorial, glass, varsity]
      post:
        description: "Post to X (untick to only make drafts)"
        type: boolean
        default: false

permissions:
  contents: write   # saves the game history and the posting log

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r src/social/requirements.txt
      - name: Update the game history
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python src/social/cupcake_history.py
          python src/social/team_facts.py || echo "Facts skipped this time"   # team pages: Just the Facts
          python src/social/nfl_facts.py --refresh || echo "NFL facts skipped this time"
      - name: Make the drafts
        env:
          THEME: ${{ inputs.theme || 'random' }}
          STAT: ${{ inputs.stat }}
        run: |
          # drafts (every stat, for previewing) only on manual runs; scheduled runs go straight to the post
          if [ "${{ github.event_name }}" != "schedule" ]; then python src/social/cupcake_stats.py --all --theme "$THEME" || echo "No drafts this time"; fi
          # scheduled runs: Saturday = college game-day stats, Sunday = NFL game-day stats, weekdays = the best one
          # (each list is tried in order; the first stat with something new to say posts)
          if [ -n "$STAT" ]; then TRY="$STAT best"
          else case "$(date -u +%u)" in
            6) TRY="week_drought series_week top10_drought best" ;;
            7) TRY="nfl_series_week nfl_playoff_drought nfl_primetime_record best" ;;
            *) TRY="best" ;;
          esac; fi
          for k in $TRY; do python src/social/cupcake_stats.py --stat "$k" --theme "$THEME" && break; done || echo "Nothing to post"
      - uses: actions/upload-artifact@v4
        with:
          name: cupcake-drafts
          path: out/social/
          retention-days: 14
      - name: Post to X
        if: (github.event_name == 'schedule' || inputs.post) && vars.X_POSTING_ENABLED == 'true' && hashFiles('out/social/today.json') != ''
        env:
          X_POSTING_ENABLED: ${{ vars.X_POSTING_ENABLED }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python src/social/post_to_x.py --meta out/social/today.json
      - name: Save the history and posting log
        if: success()
        run: |
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add data/history docs/data/cfb/facts.json docs/data/cfb/shame.json docs/data/nfl/facts.json
          git add data/social/posted.json 2>/dev/null || true
          for p in docs/data/takes.json docs/takes; do git add "$p" 2>/dev/null; done; true   # the Takes page (src/social/feed.py)
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Cupcake stats: history / posting log $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
