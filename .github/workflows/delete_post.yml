name: Delete an X post

# Takes one of our posts down: Actions tab > "Delete an X post" > Run workflow, and paste the post's link.
# Fill in the log key too (for example primetime-401873009) when the post should be allowed to go out again, corrected.

on:
  workflow_dispatch:
    inputs:
      post:
        description: "Link to the post (or its number)"
        required: true
        type: string
      key:
        description: "Posting-log key to forget, so it can be reposted (optional)"
        required: false
        type: string

permissions:
  contents: write   # commits data/social/posted.json when a key is dropped

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r src/social/requirements.txt
      - name: Delete the post
        env:
          POST: ${{ inputs.post }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python src/social/delete_post.py "$POST"
      - name: Forget it in the posting log, so it can go out again
        if: inputs.key != ''
        env:
          KEY: ${{ inputs.key }}
        run: |
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          for try in 1 2 3 4; do
            git fetch -q origin main && git checkout -q -f -B main origin/main
            python src/social/delete_post.py - --forget-only --key "$KEY"
            git diff --quiet -- data/social/posted.json && { echo "Log already clear"; exit 0; }
            git commit -qam "Posting log: forget $KEY" && git push -q origin main && exit 0
            sleep $((try * 5))
          done
          exit 1
