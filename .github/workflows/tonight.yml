name: Weeknight game-day post

# Monday-Friday game days (Monday/Thursday night NFL, weeknight college games): a "tonight" card with our
# model's win chances, posted at 5:30 PM Eastern (4:30 in winter). Skips days with no games. Aug-Jan.
# Run it any time: Actions tab > "Weeknight game-day post" > Run workflow (untick "Post to X" to only make the picture).
# No link, 280 characters max, win chances only (no lines). Same on/off switch as the other posts.

on:
  schedule:
    - cron: "30 21 * 8-12,1 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Pretend it's this date (YYYY-MM-DD, blank = today)"
        required: false
      post:
        description: "Post to X (untick to only make the picture)"
        type: boolean
        default: true

permissions:
  contents: write   # commits data/social/posted.json after a post

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r src/social/requirements.txt
      - name: Render tonight's card
        env:
          DATE: ${{ inputs.date }}
        run: |
          if [ -n "$DATE" ]; then python src/social/tonight.py --date "$DATE"; else python src/social/tonight.py; fi
      - uses: actions/upload-artifact@v4
        with:
          name: tonight
          path: out/social/
          retention-days: 14
          if-no-files-found: ignore
      - name: Post to X
        if: (github.event_name == 'schedule' || inputs.post) && vars.X_POSTING_ENABLED == 'true'
        env:
          X_POSTING_ENABLED: ${{ vars.X_POSTING_ENABLED }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python src/social/post_to_x.py --meta out/social/today.json
      - name: Save the posting log (so nothing repeats)
        if: success()
        run: |
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add data/social/posted.json 2>/dev/null || exit 0
          git diff --cached --quiet && echo "Nothing new posted" && exit 0
          git commit -m "Posting log update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
